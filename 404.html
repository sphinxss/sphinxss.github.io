<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — Joshua Barrera</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .not-found {
      min-height: 100svh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 2rem;
    }
    .not-found-code {
      font-family: var(--font-display);
      font-size: clamp(5rem, 18vw, 10rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.06em;
      background: linear-gradient(100deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .not-found h1 {
      margin-top: 0.5rem;
      font-family: var(--font-display);
      font-size: clamp(1.4rem, 3vw, 2rem);
      letter-spacing: -0.03em;
    }
    .not-found p {
      max-width: 42ch;
      margin: 0.9rem auto 1.8rem;
      color: var(--text-muted);
    }
    .not-found-actions {
      display: flex;
      gap: 0.7rem;
      justify-content: center;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <main class="not-found">
    <div>
      <p class="not-found-code">404</p>
      <h1>This page took a wrong turn.</h1>
      <p>The link may be outdated, or the page moved. Let's get you back to something useful.</p>
      <div class="not-found-actions">
        <a class="btn btn--primary" href="/">Back to home</a>
        <a class="btn btn--ghost" href="/#projects">See my projects</a>
      </div>
    </div>
  </main>
</body>
</html>
